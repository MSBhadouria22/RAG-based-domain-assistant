<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG Domain Assistant</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .app {
      width: min(1000px, 94vw);
      height: min(720px, 92vh);
      background: white;
      border: 1px solid #e5e8ef;
      border-radius: 20px;
      box-shadow: 0 15px 45px rgba(30, 40, 70, .10);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 20px 24px;
      border-bottom: 1px solid #e8ebf1;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: #172033;
      color: white;
      font-weight: 800;
    }
    h1 { margin: 0; font-size: 20px; }
    .subtitle { margin: 4px 0 0; color: #687386; font-size: 13px; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .message {
      max-width: 78%;
      padding: 12px 15px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .assistant {
      align-self: flex-start;
      background: #f0f3f8;
    }
    .user {
      align-self: flex-end;
      background: #172033;
      color: white;
    }
    .sources {
      margin-top: 9px;
      font-size: 12px;
      color: #687386;
    }
    .composer {
      padding: 16px;
      border-top: 1px solid #e8ebf1;
      display: flex;
      gap: 10px;
    }
    textarea {
      flex: 1;
      resize: none;
      min-height: 48px;
      max-height: 130px;
      padding: 13px 15px;
      border: 1px solid #d9dee8;
      border-radius: 12px;
      outline: none;
      font: inherit;
    }
    textarea:focus { border-color: #172033; }
    button {
      border: 0;
      border-radius: 12px;
      padding: 0 20px;
      background: #172033;
      color: white;
      cursor: pointer;
      font-weight: 700;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .status { font-size: 12px; color: #7a8495; padding: 0 24px 10px; }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="logo">AI</div>
      <div>
        <h1>RAG Domain Assistant</h1>
        <p class="subtitle">Ask questions grounded in your domain knowledge base.</p>
      </div>
    </header>

    <section id="chat">
      <div class="message assistant">
        Hello! Ask me a question about the domain knowledge base.
      </div>
    </section>

    <div id="status" class="status"></div>

    <form class="composer" id="form">
      <textarea id="input" placeholder="Ask your question..." required></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </main>

<script>
  /*
    IMPORTANT:
    GitHub Pages can host this frontend, but your RAG backend must be deployed
    separately (Render, Railway, AWS, Hugging Face, etc.).

    Replace this URL with your deployed backend API endpoint.
    Example:
      const API_URL = "https://your-rag-backend.onrender.com/api/chat";
  */
  const API_URL = "YOUR_RAG_BACKEND_API_URL";

  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const status = document.getElementById("status");

  function addMessage(text, type, sources = []) {
    const box = document.createElement("div");
    box.className = "message " + type;
    box.textContent = text;

    if (sources && sources.length) {
      const sourceBox = document.createElement("div");
      sourceBox.className = "sources";
      sourceBox.textContent = "Sources: " + sources.join(", ");
      box.appendChild(sourceBox);
    }

    chat.appendChild(box);
    chat.scrollTop = chat.scrollHeight;
  }

  async function askRAG(question) {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: question })
    });

    if (!response.ok) {
      throw new Error("Backend returned HTTP " + response.status);
    }

    return await response.json();
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const question = input.value.trim();
    if (!question) return;

    addMessage(question, "user");
    input.value = "";
    send.disabled = true;
    status.textContent = "Searching the knowledge base...";

    try {
      if (API_URL === "YOUR_RAG_BACKEND_API_URL") {
        throw new Error("Set API_URL in index.html to your deployed RAG backend.");
      }

      const data = await askRAG(question);

      // Supports common backend response formats:
      // { answer: "..." }
      // { response: "..." }
      // { answer: "...", sources: ["doc1.pdf", "doc2.pdf"] }
      const answer = data.answer || data.response || data.message || "No answer received.";
      const sources = data.sources || [];

      addMessage(answer, "assistant", sources);
      status.textContent = "";
    } catch (error) {
      addMessage(
        "Sorry, I could not connect to the RAG backend.\n\n" + error.message,
        "assistant"
      );
      status.textContent = "Connection error";
    } finally {
      send.disabled = false;
      input.focus();
    }
  });

  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      form.requestSubmit();
    }
  });
</script>
</body>
</html>
